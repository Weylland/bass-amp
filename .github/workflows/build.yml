name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ./build/BassAmpTests_artefacts/Release/BassAmpTests

      - name: Package
        run: |
          ART=build/BassAmp_artefacts/Release
          lipo -info "$ART/Standalone/Bass Amp.app/Contents/MacOS/Bass Amp"

          # Ad-hoc signature: required to run on Apple Silicon. Not notarised.
          for bundle in "$ART/Standalone/Bass Amp.app" "$ART/VST3/Bass Amp.vst3" "$ART/AU/Bass Amp.component"; do
            codesign --force --deep --sign - "$bundle"
          done

          mkdir -p dist standalone plugins
          cp -R "$ART/Standalone/Bass Amp.app" standalone/
          cp -R "$ART/VST3/Bass Amp.vst3" "$ART/AU/Bass Amp.component" plugins/
          cp LICENSE standalone/LICENSE.txt
          cp LICENSE plugins/LICENSE.txt
          (cd standalone && ditto -c -k . "../dist/BassAmp-$VERSION-macOS-Standalone.zip")
          (cd plugins && ditto -c -k . "../dist/BassAmp-$VERSION-macOS-Plugins.zip")

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: build\BassAmpTests_artefacts\Release\BassAmpTests.exe

      - name: Package
        shell: bash
        run: |
          ART=build/BassAmp_artefacts/Release
          mkdir -p dist standalone plugins
          cp "$ART/Standalone/Bass Amp.exe" standalone/
          cp -R "$ART/VST3/Bass Amp.vst3" plugins/
          cp LICENSE standalone/LICENSE.txt
          cp LICENSE plugins/LICENSE.txt
          python - <<'EOF'
          import os, zipfile
          version = os.environ["VERSION"]
          for folder, kind in [("standalone", "Standalone"), ("plugins", "VST3")]:
              with zipfile.ZipFile(f"dist/BassAmp-{version}-Windows-x64-{kind}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
                  for root, _, files in os.walk(folder):
                      for name in files:
                          path = os.path.join(root, name)
                          archive.write(path, os.path.relpath(path, folder).replace(os.sep, "/"))
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" \
              --title "Bass Amp ${GITHUB_REF_NAME#v}" --generate-notes
          fi
